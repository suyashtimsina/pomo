<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro ✿</title>
<meta name="description" content="A cute, minimal pomodoro timer that sits on top of your webcam.">
<meta name="theme-color" content="#1b1620">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div id="shade"></div>
<div id="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="18" r="11" fill="#ff6f8f"/><path d="M16 9c-1-3-4-4-6-3 2 0 3 1 4 3-2-1-5 0-6 2 3-1 5 0 8 1 3-1 5-2 8-1-1-2-4-3-6-2 1-2 2-3 4-3-2-1-5 0-6 3z" fill="#7bd88f"/></svg><span>pomo</span><span class="fl">✿</span></div>

<div id="camMsg"><div style="max-width:320px;text-shadow:0 2px 10px rgba(0,0,0,.5)"><div style="font-size:20px">camera is off ♡</div><div id="camHint" style="font-size:14px;margin-top:6px;opacity:.9"></div><button id="camBtn">turn on camera</button> <button id="camTab" style="display:none">open in new tab</button></div></div>

<div id="timer">
  <div id="pill">
    <svg viewBox="0 0 176 64" aria-hidden="true"><path class="track" d="M88 3H144A29 29 0 0 1 144 61H32A29 29 0 0 1 32 3Z" pathLength="100"/><path id="arc" d="M88 3H144A29 29 0 0 1 144 61H32A29 29 0 0 1 32 3Z" pathLength="100"/></svg>
    <div id="time">25:00</div>
  </div>
  <div id="msg">time to focus ✿</div>
</div>

<div id="dock">
  <div id="modes">
    <button data-m="focus">focus</button>
    <button data-m="short">short break</button>
    <button data-m="long">long break</button>
  </div>
  <div id="ctl">
    <button id="go">start</button>
    <button id="reset">reset</button>
    <button id="skip">skip</button>
  </div>
</div>

<div id="todo">
  <div id="tbox">
    <div class="th">to-do ✿</div>
    <ul id="tlist"></ul>
    <div id="tempty">nothing yet ♡</div>
    <div class="tadd"><input id="tin" type="text" placeholder="add a task…" maxlength="80" autocomplete="off"><button id="tadd" aria-label="Add task">+</button></div>
    <button id="tclear">clear done</button>
  </div>
  <button id="ttog"><span id="tarrow">▴</span> to-do <span id="tn"></span></button>
</div>

<button class="fab" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<button class="fab" id="fsBtn" aria-label="Toggle full screen"><svg id="fsIcon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>

<div id="modal"><div class="card">
  <h2>settings ✿</h2>
  <div class="row"><label for="sFocus">focus (min)</label><input id="sFocus" type="number" min="1" max="180"></div>
  <div class="row"><label for="sShort">short break (min)</label><input id="sShort" type="number" min="1" max="60"></div>
  <div class="row"><label for="sLong">long break (min)</label><input id="sLong" type="number" min="1" max="90"></div>
  <div class="row"><label for="sEvery">long break every</label><input id="sEvery" type="number" min="2" max="10"></div>
  <div class="row"><label for="sAuto">auto-start next</label><input id="sAuto" type="checkbox"></div>
  <div class="acts"><button id="cancel">cancel</button><button class="save" id="save">save</button></div>
</div></div>

<script src="script.js"></script>
</body>
</html>
